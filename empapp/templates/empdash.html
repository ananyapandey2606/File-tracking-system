{% extends 'empbase.html' %}
{% load static %}
{% block employee %}
<style>
    .icon{
        height:50px;
        width:50px;
        background-color: #0B6623;
        border-radius: 100%;
    }
    .icon i{
        font-size: 20px;
        margin-top: 15px;
        margin-left:12px;
        color: white;
    }
</style>
<div class="container-fluid">
    <div class="col-sm-12">
        <div class="card p-4" style="background-color:#0B6623; color:white; border-radius:20px;">
            <h2 style="color:white;">Welcome Employee, GGL Head Office</h2>
            <p>Manage complete file movement system from this dashboard. </p>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-3">
            <div class="card p-3 shadow-lg" style="border-radius: 30px;">
                <div class="icon"><i class="fas fa-file-export"></i></div>
                <h2 class="fw-bold mt-3 ms-2">{{file_init}}</h2>
                <p class="fw-bold ms-2">Initiated Files</p>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card p-3 shadow-lg" style="border-radius: 30px;">
                <div class="icon"><i class="fas fa-clock"></i></div>
                <h2 class="fw-bold mt-3 ms-2">{{pending_files}}</h2>
                <p class="fw-bold ms-2">Pending Files</p>
            </div>

        </div>
        <div class="col-sm-3">
            <div class="card p-3 shadow-lg" style="border-radius: 30px;">
                <div class="icon"><i class="fa-regular fa-folder"></i></div>
                <h2 class="fw-bold mt-3 ms-2">{{closed_files}}</h2>
                <p class="fw-bold ms-2">Close Files</p>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card p-3 shadow-lg" style="border-radius: 30px;">
                <div class="icon"><i class="fas fa-file-import"></i></div>
                <h2 class="fw-bold mt-3 ms-2">0</h2>
                <p class="fw-bold ms-2">Received Files</p>
            </div>
        </div>
    </div>

</div>
{% endblock %}
